name: Tray platform checks

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'src/tray/**'
      - 'src/server*.ts'
      - 'src/cli.ts'
      - 'src/npm-cli.ts'
      - 'src/pi/**'
      - 'runtime/pi/**'
      - 'voice/realtime/**'
      - 'tests/native-launch.test.cjs'
      - 'tests/runtime-smoke.cjs'
      - 'tray/**'
      - 'tests/tray*'
      - 'tests/fixtures/fake-tray-worker.cjs'
      - 'package*.json'
      - '.github/workflows/tray-check.yml'

permissions:
  contents: read

jobs:
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: node --test tests/tray.test.cjs tests/native-launch.test.cjs
      - run: npm run test:tray:native
      - name: Private runtime setup and synthetic loopback protocol
        run: node tests/runtime-smoke.cjs
      # Startup/update/exit is not proof that a person can see or click the icon.
      # Manual menu, browser, close-terminal, logout and OS-policy checks remain.
