name: Release to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed stable version to publish (must match package.json)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require source already on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Validate literal version and committed manifest/lock agreement
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs

  qualification:
    needs: validate
    uses: ./.github/workflows/qualification.yml

  platforms:
    needs: validate
    uses: ./.github/workflows/tray-check.yml

  release:
    needs: [validate, qualification, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >=11.5.1; pin a Node-compatible CLI.
      - run: npm install --global npm@12.2.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm run build
      - name: Publish only after qualification
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
