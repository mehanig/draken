name: Application qualification

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            runtime/pi/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/*.test.cjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: node --test tests/live-browser.cjs tests/realtime-browser.cjs
      - run: npx --no-install playwright test
      - name: Public site layout and synthetic evidence interaction
        run: node --test tests/site-browser.cjs
      - name: Audit application, client and separately shipped private runtime
        run: |
          for directory in . client runtime/pi; do
            npm --prefix "$directory" audit --omit=dev --audit-level=low
            npm --prefix "$directory" audit --json > "$RUNNER_TEMP/audit.json" || test "$?" -eq 1
            node <<'JS'
          const report = JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/audit.json', 'utf8'));
          if (report.error || !report.vulnerabilities) throw Error('Audit did not return a vulnerability report');
          const findings = Object.values(report.vulnerabilities);
          const advisories = findings.flatMap(finding => finding.via).filter(via => typeof via === 'object');
          // Approved dev-only exception: unpatched picomatch ReDoS in knip/Vite.
          // Strict production audit above also blocks this advisory if it becomes shipped.
          if ((findings.length && !advisories.length) || advisories.some(via => via.name !== 'picomatch' || via.url !== 'https://github.com/advisories/GHSA-fc5q-39xc-vjpf')) {
            console.error(report); process.exit(1);
          }
          if (advisories.length) console.warn('Accepted dev-only GHSA-fc5q-39xc-vjpf; remove this exception when patched.');
          JS
          done
      - name: Fresh production-only package and lifecycle
        run: node tests/package-smoke.cjs
      - name: Private runtime setup and synthetic loopback protocol
        run: node tests/runtime-smoke.cjs
      - name: Synthetic UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-failure
          path: .test-artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
